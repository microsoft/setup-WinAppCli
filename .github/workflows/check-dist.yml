# `dist/index.js` is a special file in Actions.
# When you reference an action with `uses:` in a workflow,
# `index.js` is the code that will run.
# For our project, we generate this file through a build process from other source files.
# We need to make sure the checked-in `index.js` actually matches what we expect it to be.
name: Check dist/

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  check-dist:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the trusted bundler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted-build
          sparse-checkout: build.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Remove .npmrc to avoid using private registries
        run: rm .npmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild both distributables
        run: |
          Copy-Item .trusted-build\build.mjs .trusted-build.mjs
          Remove-Item dist\index.js, setup-winappcli-task\index.js
          node .trusted-build.mjs

      - name: Compare the expected and actual distributables
        run: |
          git ls-files --error-unmatch -- dist\index.js setup-winappcli-task\index.js setup-winappcli-task\lib.json setup-winappcli-task\lib2.json
          if ($LASTEXITCODE -ne 0) {
            throw "Required generated files must be tracked."
          }
          git diff --exit-code --ignore-space-at-eol -- dist/ setup-winappcli-task/
          if ($LASTEXITCODE -ne 0) {
            echo "Detected uncommitted changes after build.  See status below:"
            exit 1
          }
        id: diff

      # If index.js was different than expected, upload the expected version as an artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        with:
          name: dist
          path: |
            dist/
            setup-winappcli-task/
