version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      # The codeql-action sub-actions must always run at the same version;
      # bumping them in separate PRs causes a CodeQL configuration error.
      codeql-action:
        patterns:
          - github/codeql-action/*

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
